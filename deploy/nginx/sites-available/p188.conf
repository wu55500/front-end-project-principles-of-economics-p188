# Rate-limit zones (general/srv/perip) are defined in conf.d/00-hardening.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # hard limits on request size / rate
    client_max_body_size 2m;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 15s;
    keepalive_timeout 20s;
    server_tokens off;

    # ---- Security response headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # ---- Block reconnaissance / sensitive files immediately ----
    location ~* /\.(git|env|aws|svn|hg|dockerignore|npmrc) { return 404; }
    location ~* (composer\.(json|lock)|package(-lock)?\.json|\.map$|\.sql$|\.log$|\.bak$|\.old$|~$) { return 404; }
    location ~* (wp-admin|wp-login|xmlrpc\.php|/phpmyadmin|/adminer|\.php$|\.asp$) { return 404; }
    location = /favicon.ico { return 204; access_log off; }

    # ---- Server functions / API: strict per-IP rate limiting ----
    location ^~ /_server {
        limit_req zone=srv burst=12 nodelay;
        limit_conn perip 10;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
    }

    location ^~ /api/ {
        limit_req zone=srv burst=20 nodelay;
        limit_conn perip 12;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # ---- Static assets: cached, rate limited lightly ----
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|webp|avif|ico)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        limit_conn perip 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
    }
}
